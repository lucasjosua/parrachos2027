<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réveillon & Ativações de Janeiro 2027 - Cond. Parrachos de Pirangi</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--tx:#1d2733;--mut:#6b7684;--bd:#e3dfd5;--pri:#0f6e8c;--ok:#1f8a4c;--warn:#c27a00;--bad:#c2412d;--okbg:#e3f4ea;--warnbg:#fdf0d5;--badbg:#fbe4df;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a22;--card:#1b2631;--tx:#e8edf2;--mut:#93a0ad;--bd:#2c3a48;--pri:#4cb5d6;--ok:#4cc27f;--warn:#e9a93a;--bad:#ef7b68;--okbg:#17352500;--warnbg:#3a2f12;--badbg:#3d1f1a;--okbg:#173525}}
:root[data-theme="dark"]{--bg:#121a22;--card:#1b2631;--tx:#e8edf2;--mut:#93a0ad;--bd:#2c3a48;--pri:#4cb5d6;--ok:#4cc27f;--warn:#e9a93a;--bad:#ef7b68;--okbg:#173525;--warnbg:#3a2f12;--badbg:#3d1f1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:1.35rem;margin:0}h1 small{display:block;font-weight:400;color:var(--mut);font-size:.8rem}
button,select,input{font:inherit;color:var(--tx)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:8px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:1.8rem;line-height:1.1}.kpi span{color:var(--mut);font-size:.82rem}
.money{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.money b{font-size:1.25rem;display:block}.money span{color:var(--mut);font-size:.8rem}
.bar{height:12px;background:var(--bd);border-radius:99px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:var(--ok);width:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 10px}
.tools input,.tools select{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;min-width:0}
.tools input{flex:1 1 180px}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.row+.row{margin-top:10px}
.nm{font-weight:600}.sub{color:var(--mut);font-size:.82rem}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:600}
.t-ok{background:var(--okbg);color:var(--ok)}.t-warn{background:var(--warnbg);color:var(--warn)}.t-bad{background:var(--badbg);color:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.vals{text-align:right;font-size:.85rem}.vals b{font-size:1rem}
dialog{max-height:90dvh;overflow:auto;border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);width:min(460px,calc(100% - 24px));padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:.82rem;color:var(--mut);margin:12px 0 4px}
dialog input,dialog select,dialog textarea{font:inherit;color:var(--tx);resize:vertical;width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.empty{text-align:center;color:var(--mut);padding:26px}
#aviso{display:none;background:var(--warnbg);color:var(--warn);padding:10px 14px;border-radius:10px;margin-bottom:12px}
a{color:var(--pri)}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Réveillon & Ativações de Janeiro 2027 - Cond. Parrachos de Pirangi<small>Controle de inscrições e pagamentos dos chalés</small></h1>
<div style="display:flex;gap:8px"><button class="btn" id="novo">+ Nova inscrição</button></div>
</header>
<div id="aviso">Banco de dados indisponível nesta visualização: abra o link pela sua conta do Claude para salvar e ver os dados.</div>

<div class="grid" id="kpis"></div>
<div class="card"><div class="money" id="money"></div><div class="bar"><i id="pb"></i></div><div class="sub" id="pt"></div></div>

<div class="tools">
<input id="q" type="search" placeholder="Buscar nome ou chalé">
<select id="f">
<option value="todos">Todos</option><option value="quitado">Quitados</option><option value="parcial">Pagou parte</option><option value="pendente">Sem pagamento</option>
<option value="reveillon">Só réveillon</option><option value="ativacoes">Só ativações</option><option value="combo">Combo</option><option value="inquilino">Inquilinos</option><option value="proprietario">Proprietários</option>
</select>
</div>
<div id="lista"></div>
</div>

<dialog id="dlg"><form id="frm" method="dialog" onsubmit="return false">
<h2 id="dt" style="margin:0 0 4px;font-size:1.15rem">Nova inscrição</h2>
<div id="resumo" class="sub" style="display:none;margin:4px 0 6px"></div><div id="dados"><label>Nome</label><input id="nome" required>
<div class="two"><div><label>Chalé</label><input id="chale" required></div>
<div><label>Situação</label><select id="tipo"><option value="proprietario">Proprietário</option><option value="inquilino">Inquilino</option></select></div></div>
<label>Participação</label>
<select id="plano"><option value="reveillon">Só réveillon: R$ 300,00</option><option value="ativacoes">Só ativações de janeiro: R$ 400,00</option><option value="combo">Combo (os dois): R$ 600,00</option></select>
<label>Observação</label><textarea id="obs" rows="2" placeholder="Ex.: desconto combinado, pagou por outra pessoa..."></textarea></div>
<label>Pagamentos (parcelas)</label><div id="pags"></div>
<div class="card" style="margin-top:8px;padding:10px"><div class="two"><div><label style="margin-top:0">Valor (R$)</label><input id="pv" type="number" min="0" step="0.01" inputmode="decimal"></div><div><label style="margin-top:0">Data do pagamento</label><input id="pd" type="date"></div></div>
<div id="upw"><label>Comprovante desta parcela (opcional)</label><input id="file" type="file" accept="image/*,application/pdf"></div>
<button type="button" class="btn sm" id="addp" style="margin-top:10px">Adicionar pagamento</button></div>
<div class="foot"><button type="button" class="btn sec" id="cancel">Cancelar</button><button type="button" class="btn" id="salvar">Salvar</button></div>
</form></dialog>
<dialog id="cdlg"><h2 style="margin:0 0 6px;font-size:1.1rem">Você realmente deseja excluir?</h2><div id="ctx" class="sub"></div><div id="cerr" class="sub" style="color:var(--bad)"></div><div class="foot"><button type="button" class="btn sec" id="cno">Cancelar</button><button type="button" class="btn" id="cyes" style="background:var(--bad)">Excluir</button></div></dialog>
<div id="toast" popover="manual" style="position:fixed;inset:auto 12px 16px 12px;margin:0 auto;max-width:420px;background:var(--bad);color:#fff;padding:12px 14px;border:0;border-radius:10px"></div>

<script>
var PRECO={reveillon:300,ativacoes:400,combo:600};
var NOME={reveillon:"Só réveillon",ativacoes:"Só ativações",combo:"Combo"};
var col=null,assets=null,rows=[],editId=null,editPags=[];
var $=function(i){return document.getElementById(i)};
var delId=null;
window.alert=function(m){var t=$("toast");t.textContent=m;try{t.showPopover()}catch(e){}clearTimeout(window._tt);window._tt=setTimeout(function(){try{t.hidePopover()}catch(e){}},5000)};
var brl=function(v){return (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})};
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
function pg(r){return r.pagamentos?r.pagamentos.reduce(function(s,x){return s+(+x.valor||0)},0):(+r.pago||0)}
function hoje(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fd(s){if(!s)return "sem data";var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function st(r){var dev=PRECO[r.plano]||0,p=pg(r);return p>=dev?"quitado":p>0?"parcial":"pendente"}

function render(){
  var tot=rows.length,c={reveillon:0,ativacoes:0,combo:0},q=0,inq=0,prev=0,rec=0;
  rows.forEach(function(r){c[r.plano]++;if(st(r)=="quitado")q++;prev+=PRECO[r.plano]||0;rec+=Math.min(pg(r),PRECO[r.plano]||0)});
  var k=[["Inscritos",tot],["Só réveillon",c.reveillon],["Só ativações",c.ativacoes],["Combo",c.combo],["Quitaram",q],["Em aberto",tot-q]];
  $("kpis").innerHTML=k.map(function(x){return '<div class="card kpi"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join("");
  $("money").innerHTML=[["Previsto",prev],["Recebido",rec],["Falta receber",prev-rec]].map(function(x){return '<div><b>'+brl(x[1])+'</b><span>'+x[0]+'</span></div>'}).join("");
  var pc=prev?Math.round(rec/prev*100):0;$("pb").style.width=pc+"%";$("pt").textContent=pc+"% do valor previsto já recebido";

  var f=$("f").value,b=$("q").value.trim().toLowerCase();
  var l=rows.filter(function(r){
    if(b&&(r.nome+" "+r.chale).toLowerCase().indexOf(b)<0)return false;
    if(f=="todos")return true;
    if(f=="inquilino"||f=="proprietario")return r.tipo==f;
    if(PRECO[f])return r.plano==f;
    return st(r)==f;
  }).sort(function(a,b){return a.nome.localeCompare(b.nome)});
  $("lista").innerHTML=l.length?l.map(function(r){
    var s=st(r),dev=PRECO[r.plano]||0,p=pg(r),cls=s=="quitado"?"t-ok":s=="parcial"?"t-warn":"t-bad",lb=s=="quitado"?"Quitado":s=="parcial"?"Pagou parte":"Sem pagamento";
    var cm=(r.pagamentos||[]).slice().sort(function(a,b){return (a.data||"")<(b.data||"")?-1:1}).map(function(x){return '<div class="sub">'+fd(x.data)+' · <b>'+brl(x.valor)+'</b>'+(x.comp?' · <a href="'+esc(x.comp.url)+'" target="_blank" rel="noopener">comprovante</a>':'')+'</div>'}).join("");
    return '<div class="card"><div class="row"><div><div class="nm">'+esc(r.nome)+'</div><div class="sub">Chalé '+esc(r.chale)+' · '+(r.tipo=="inquilino"?"Inquilino":"Proprietário")+' · '+NOME[r.plano]+'</div></div>'+
    '<div class="vals"><span class="tag '+cls+'">'+lb+'</span><div><b>'+brl(p)+'</b> / '+brl(dev)+'</div>'+(p<dev?'<div class="sub">Falta '+brl(dev-p)+'</div>':'')+'</div>'+
    '<div class="acts">'+(s!="quitado"?'<button class="btn sm" data-a="q" data-id="'+r.id+'">Marcar quitado</button>':'')+'<button class="btn sm" data-a="p" data-id="'+r.id+'">Adicionar pagamento</button><button class="btn sm sec" data-a="e" data-id="'+r.id+'">Editar</button><button class="btn sm sec" data-a="d" data-id="'+r.id+'">Excluir</button>'+'</div>'+((cm||r.obs)?'<div style="grid-column:1/-1;border-top:1px solid var(--bd);padding-top:6px">'+cm+(r.obs?'<div class="sub" style="margin-top:4px"><b>Obs.:</b> '+esc(r.obs)+'</div>':'')+'</div>':'')+'</div></div>';
  }).join(""):'<div class="empty">Nenhuma inscrição encontrada.</div>';
}

function rp(){var t=editPags.reduce(function(s,x){return s+(+x.valor||0)},0);$("pags").innerHTML=editPags.length?editPags.map(function(x,i){return '<div class="row" style="padding:6px 0;border-bottom:1px solid var(--bd)"><div class="sub">'+fd(x.data)+' · <b>'+brl(x.valor)+'</b>'+(x.comp?' · <a href="'+esc(x.comp.url)+'" target="_blank" rel="noopener">comprovante</a>':'')+'</div><button type="button" class="btn sm sec" data-i="'+i+'">Remover</button></div>'}).join("")+'<div class="sub" style="margin-top:6px">Total pago: <b>'+brl(t)+'</b> de '+brl(PRECO[$("plano").value])+'</div>':'<div class="sub">Nenhum pagamento lançado.</div>'}
async function addpag(){var v=+$("pv").value;if(!(v>0)){alert("Informe o valor do pagamento.");return false}
  var p={valor:v,data:$("pd").value||hoje()};var fl=$("file").files[0];
  if(fl&&assets){var u=await assets.upload(fl);p.comp={id:u.id,url:u.url}}
  editPags.push(p);$("pv").value="";$("file").value="";rp();return true}
function abrir(id,foco){
  editId=id||null;var r=rows.find(function(x){return x.id==id})||{};
  $("dt").textContent=id?(foco?"Adicionar pagamento":"Editar inscrição"):"Nova inscrição";
  $("nome").value=r.nome||"";$("chale").value=r.chale||"";$("tipo").value=r.tipo||"proprietario";$("plano").value=r.plano||"reveillon";$("obs").value=r.obs||"";$("file").value="";
  editPags=(r.pagamentos||(+r.pago?[{valor:+r.pago,data:""}]:[])).slice();
  $("pv").value="";$("pd").value=hoje();rp();
  $("upw").style.display=assets?"block":"none";
  $("dados").style.display=foco?"none":"block";$("resumo").style.display=foco?"block":"none";if(foco)$("resumo").innerHTML="<b>"+esc(r.nome)+"</b> · Chalé "+esc(r.chale)+" · "+NOME[r.plano]+" ("+brl(PRECO[r.plano])+")";
  $("dlg").showModal();if(foco)$("pv").focus();
}
async function salvar(){
  if(!col)return;var nome=$("nome").value.trim(),chale=$("chale").value.trim();
  if(!nome||!chale){alert("Preencha nome e chalé.");return}
  $("salvar").disabled=true;
  try{
    if($("pv").value){if(!(await addpag())){$("salvar").disabled=false;return}}
    var d={nome:nome,chale:chale,tipo:$("tipo").value,plano:$("plano").value,pagamentos:editPags,obs:$("obs").value.trim(),atualizado:Date.now()};
    var id=editId||(crypto.randomUUID?crypto.randomUUID():String(Date.now()));
    await col.doc(id).set(d);$("dlg").close();
  }catch(e){alert("Não foi possível salvar: "+(e&&e.message||e))}
  $("salvar").disabled=false;
}
$("lista").addEventListener("click",async function(e){
  var b=e.target.closest("button");if(!b||!col)return;var id=b.dataset.id,r=rows.find(function(x){return x.id==id});
  try{
    if(b.dataset.a=="e")abrir(id);
    else if(b.dataset.a=="p")abrir(id,true);
    else if(b.dataset.a=="q"){var ps=(r.pagamentos||(+r.pago?[{valor:+r.pago,data:""}]:[])).slice();ps.push({valor:PRECO[r.plano]-pg(r),data:hoje()});await col.doc(id).update({pagamentos:ps})}
    else if(b.dataset.a=="d"){delId=id;$("ctx").textContent=r.nome+" · Chalé "+r.chale;$("cerr").textContent="";$("cdlg").showModal()}
  }catch(x){alert("Erro: "+(x&&x.message||x))}
});
$("cno").onclick=function(){$("cdlg").close()};
$("cyes").onclick=async function(){try{await col.doc(delId).delete();$("cdlg").close()}catch(e){$("cerr").textContent="Não foi possível excluir: "+(e&&e.message||e)}};
$("novo").onclick=function(){abrir()};$("cancel").onclick=function(){$("dlg").close()};$("salvar").onclick=salvar;
$("q").oninput=render;$("f").onchange=render;$("plano").onchange=rp;
$("addp").onclick=async function(){try{if(!(await addpag()))return;if(editId&&col){await col.doc(editId).update({pagamentos:editPags});if($("dados").style.display=="none")$("dlg").close()}}catch(e){alert("Erro ao salvar: "+(e&&e.message||e))}};
$("pags").onclick=function(e){var b=e.target.closest("button");if(b){editPags.splice(+b.dataset.i,1);rp();if(editId&&col)col.doc(editId).update({pagamentos:editPags}).catch(function(){alert("Erro ao remover o pagamento.")})}};
render();
(async function(){
  try{
    var r=await Promise.all([claude.use("db"),claude.use("assets")]);assets=r[1];
    if(!r[0]){$("aviso").style.display="block";return}
    col=r[0].collection("pessoas");
    col.onSnapshot(function(s){rows=s.docs.map(function(d){var x=Object.assign({},d.data());x._id=d.id;x.id=d.id;return x});render()},function(){$("aviso").style.display="block"});
  }catch(e){$("aviso").style.display="block"}
})();
</script>
</body>
</html>
